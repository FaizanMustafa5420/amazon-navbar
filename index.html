<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="navbar">
            <div class="nav-logo ">
                <div class="logo ">
                    <img src="assets/images/amazon_PNG11.png" alt="">
                </div>
            </div>
            <div class="nav-address border">
                <p class="first-add">Deliver to</p>
                <div class="add-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="second-add">Pakistan</p>
                </div>
            </div>
            <div class="nav-search">
                <select class="select-search">
                    <option> All </option>
                </select>
                <input placeholder="Search Amazon" class="search-input">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
            <div class="language">
                <img src="assets/images/pakistan-flag-icon.webp" alt="">
                <span>EN</span>
                <i class="ri-arrow-down-s-fill"></i>
            </div>
            <div class="sign-in border">
                <span>Hello, sign in</span>
                <p class="nav-second"> Accounts & Lists</p>
            </div>
            <div class="return border">
                <span>Returns</span>
                <p class="nav-second">& Orders</p>
            </div>
            <div class="nav-cart border">
                <i class="fa-solid fa-cart-shopping"></i>
                Cart
            </div>
        </div>
        <div class="panel">
            <div class="panel-all">
                <i class="fa-solid fa-bars"></i>
                All
            </div>
            <div class="option">
                <p>Today's Deals</p>
                <p>Prime Video</p>
                <p>Gift Cards</p>
                <p>Sell</p>
                <p>Customer Service</p>
                <p>Registry</p>
            </div>
        </div>
    </header>

</body>

</html>
