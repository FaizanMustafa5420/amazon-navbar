<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amazon navbar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <div class="logo-container">
            <i class="ri-menu-line"></i>
            <img src="assets/images/amazon_PNG11.png" alt="">
            <div class="content">
                <div class="sign-in">
                    <span>sing in</span>
                    <i class="ri-arrow-drop-right-line"></i>
                </div>
                <div class="contact">
                    <i class="ri-contacts-line"></i>
                </div>
                <div class="cart">
                    <svg class="cart-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path
                            d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" />
                    </svg>
                    <span class="cart-badge">0</span>
                </div>
                <div class="sells">
                    <ul>
                        <li>Video</li>
                        <li>Deals</li>
                        <li>AmazonBasics</li>
                        <li>Livestreams</li>
                        <li>Books</li>
                        <li>BestSeller</li>
                        
                    </ul>
                </div>
            </div>

        </div>
        <div class="location-icon">
            <i class="ri-map-pin-line"></i>
        </div>
        <div class="location-text">
            <div class="top-text">
                <span>Deliver to</span>
            </div>
            <div class="bottom-text">
                <span>Pakistan</span>
            </div>
        </div>
        <div class="search-box">
            <div class="more">
                <span>All</span>
                <i class="ri-arrow-down-s-fill"></i>
            </div>
            <div class="hero-buttons">
                <input type="amazon" class="amazon-field" placeholder="Search Amazon">
            </div>
            <div class="search-icon">
                <span></span>
                <i class="ri-search-line"></i>
            </div>
            <div class="language">
                <img src="assets/images/Flag_of_the_United_States.svg.webp" alt="">
                <span>EN</span>
                <i class="ri-arrow-down-s-fill"></i>
            </div>
            <div class="sign-in">
                <div class="top-text">
                    <span>Hello, sign in</span>
                </div>
                <div class="bottom-text">
                    <span>Accounts & Lists</span>
                    <i class="ri-arrow-down-s-fill"></i>
                </div>
            </div>
            <div class="orders">
                <div class="top-text">
                    <span>Returns</span>
                </div>
                <div class="bottom-text">
                    <span>& Orders</span>
                </div>
            </div>
            <div class="cart">
                <svg class="cart-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" />
                </svg>
                <span class="cart-badge">0</span>
                <span class="cart-name">Cart</span>
            </div>
        </div>
    </div>
</body>

</html>
